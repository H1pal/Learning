<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heepal</title>
    <link rel="stylesheet" href="/sandbox/structure/html_structure/style.css">
</head>
<body>
    <div class="container">
      
      <!-- 텍스트 관련 스타일 -->
      <div class="item" id="textbox">
        <p>
          I have a <em>car</em> do you wanna <i>more car?</i> could you catch me every search <cite>tuple</cite>
        </p>
        <!-- 
        em: 강조(화면 낭독기 및 검색 엔진에 영향)
        i: 이탤릭체
        cite: 책, 영화, 노래, 연극, 그림 등 창작물의 제목이나 출처
          -->
        <p>
          <span id="em-font">em 폰트</span>
          <span id="rem-font">rem 폰트</span>
        </p>

        <p class="textbox_lh">라인헤잍</p>
        <p class="textbox_lh">라인헤이트 테스트</p>
        <p class="textbox_lh">라인헤이트 테스트 권법</p>
      </div>
        
      <!-- 리스트 -->
      <div class="item" id="listbox">
        <ol>
          <li>안녕</li>
          <li>하세요</li>
          <li>터틀</li>
        </ol>
        

        <ul>
          <li>톨레랑스</li>
          <li>인생</li>
          <li>망함</li>
        </ul>
      </div>

      <!-- 설명문 박스 -->
      <div class="item" id="dddlbox">
        <dl>
          <dt>제목</dt>
          <dd>
            설명설명
          </dd>
          <dt>
            <dd>
              설명설설명
            </dd>
            <dd>진짜 설명</dd>
          </dt>
        </dl>
      </div>

      <!-- 이미지와 float -->
      <div class="item" id="imagebox">
        <img src="/sandbox/assets/progsub.png" alt="file">
        <p>collecting</p>
        <p>이 이미지는 영국에서부터 시작하여 홀로 서게 되었습니다.</p>
      </div>

      <!-- float -->
      <div class="item" id="floatbox">
        <div class="floatbox_child" id="fc1"></div>
        <div class="floatbox_child" id="fc2"></div>
      </div>
      
      <!-- table -->
      <div class="item" id="tablebox">
        <table>
          <caption>
            캠션
          </caption>

          <!-- 티헤드 -->
          <thead>
            <tr>
              <th>머리</th>
              <th>머리1</th>
              <th>머리22</th>
            </tr>
          </thead>
          <!-- 티바디 -->
          <tbody>
            <tr>
              <td rowspan="2">바디</td>
              <td>훅</td>
              <td>잽</td>
            </tr>
            <tr>
              <td>길로틴</td>
              <td>기무라</td>
            </tr>
            <tr>
              <td>백초크</td>
              <td>다스초크</td>
              <td>더블렉테이크다운</td>
            </tr>
          </tbody>
          <!-- 티풋 -->
          <tfoot>
            <tr>
              <td>티풋</td>
              <td>tfoot</td>
              <td>tffff</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
</body>
</html>
